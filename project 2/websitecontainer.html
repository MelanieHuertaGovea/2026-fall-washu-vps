<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girl Scout Sash</title>

    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: rgb(176, 148, 114);
            font-family: Georgia;
            text-align: center;
            background-image: url("fabric.png");
            margin: 0;
            padding-top: 20px;
        }

        h1 {
            font-family: 'Bree Serif', serif;
            text-align: center;
            color: rgb(255, 248, 230);
            font-size: 38px;
            font-weight: normal;
            letter-spacing: 1px;
            margin: 200px auto 100px auto;
            padding: 8px 25px;
            background-color: transparent;
            width: fit-content;
            border: none;
        }

        h2 {
            font-size: 25px;
            font-weight: 50;
            letter-spacing: 1px;
            margin: 10px;
            text-align: center;
        }

        .sun {
            position: fixed;
            top: 20px;
            left: 5px;
            width: 160px;
            height: auto;
            z-index: 10;
        }

        .council {
            position: fixed;
            top: 20px;
            right: 5px;
            width: 165px;
            height: auto;
            z-index: 10;
        }

        .arts {
            width: 215px;
            height: auto;
            display: block;
            margin: 90px auto;
        }

        .swifty {
            width: 240px;
            height: auto;
            display: block;
            margin: 90px auto;
        }

        .reading {
            width: 280px;
            height: auto;
            display: block;
            margin: 90px auto;
        }

        .camping {
            width: 215px;
            height: auto;
            display: block;
            margin: 90px auto;
        }

        .dance {
            width: 215px;
            height: auto;
            display: block;
            margin: 90px auto;
        }

        .travel {
            width: 250px;
            height: auto;
            display: block;
            margin: 90px auto;
        }

        .arts, .swifty, .reading, .camping, .dance, .travel {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .arts:hover, .swifty:hover, .reading:hover, .camping:hover, .dance:hover, .travel:hover {
            transform: scale(1.1) rotate(-3deg);
        }
    </style>
</head>

<body>

    <img src="sun (1).png" class="sun" alt="Sun badge">

    <img src="council (1).png" class="council" alt="Council badge">

    <h1>My Digital Sash</h1>

    <a href="arts.html">
        <img src="arts (1).png" class="arts" alt="Arts badge">
    </a>

    <a href="swifty.html">
        <img src="swifty (1).png" class="swifty" alt="Swifty badge">
    </a>

    <a href="reading(2).html">
        <img src="reading (2).png" class="reading" alt="Reading badge">
    </a>

    <a href="camping.html">
        <img src="camping (1).png" class="camping" alt="Camping badge">
    </a>

    <a href="dance.html">
        <img src="dance (1).png" class="dance" alt="Dance badge">
    </a>

    <a href="travel.html">
        <img src="travel (1).png" class="travel" alt="Travel badge">
    </a>

</body>
</html>
