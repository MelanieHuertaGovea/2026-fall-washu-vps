<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dance Badge</title>

    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: rgb(176, 148, 114);
            background-image: url("fabric.png");
            font-family: Georgia;
            text-align: center;
        }

        h1 {
            font-family: 'Bree Serif', serif;
            color: rgb(255, 248, 230);
            font-weight: normal;
        }

        .badge {
            width: 220px;
        }

        .story {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin: 60px auto;
            width: 80%;
        }

        .story img {
            width: 300px;
            height: auto;
        }

        .story p {
            font-family: 'Bree Serif', serif;
            font-size: 18px;
            color: white;
            text-align: left;
            line-height: 1.6;
            max-width: 450px;
        }

        .story-two {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin: 100px auto 60px auto;
            width: 80%;
        }

        .story-two img {
            width: 300px;
            height: auto;
        }

        .story-two p {
            font-family: 'Bree Serif', serif;
            font-size: 18px;
            color: white;
            text-align: left;
            line-height: 1.6;
            max-width: 450px;
        }

        a {
            color: white;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <img src="dance (1).png" class="badge" alt="Dance Badge">

    <h1>Dance Badge</h1>

    <div class="story">

        <img src="folklorico1.png" alt="Folklorico Dance">

        <p>
            Carnaval 2026
        </p>

    </div>

    <div class="story-two">

        <p>
            Carnaval 2025
        </p>

        <img src="folklorico2.png" alt="Folklorico Dance">

    </div>

    <a href="websitecontainer.html">Back to my sash</a>

</body>
</html>
